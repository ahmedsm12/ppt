<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <!-- تدرج السماء الهادئ والمريح للعين -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bfe3f7" />
            <stop offset="45%" stop-color="#dbf0fa" />
            <stop offset="75%" stop-color="#ebf7fc" />
            <stop offset="100%" stop-color="#f6fcff" />
        </linearGradient>

        <!-- تدرج التلال البعيدة -->
        <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a3e3cb" />
            <stop offset="100%" stop-color="#84d2b4" />
        </linearGradient>

        <!-- تدرج التلال المتوسطة -->
        <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#84d6b6" />
            <stop offset="100%" stop-color="#6bc29f" />
        </linearGradient>

        <!-- تدرج التلال القريبة -->
        <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6ec7a3" />
            <stop offset="100%" stop-color="#54b08a" />
        </linearGradient>

        <!-- تدرج الشمس الدافئة اللطيفة -->
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8db" />
            <stop offset="70%" stop-color="#ffe89e" />
            <stop offset="100%" stop-color="#ffd972" />
        </radialGradient>
        
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255, 235, 160, 0.45)" />
            <stop offset="100%" stop-color="rgba(255, 235, 160, 0)" />
        </radialGradient>

        <!-- سحابة مكررة لطيفة -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- سماء هادئة مناسبة للتركيز وتقليل التشتت -->
    <rect width="1280" height="720" fill="url(#skyGrad)" />

    <!-- هالة الشمس الدافئة اللطيفة غير المشوشة -->
    <circle cx="1120" cy="110" r="110" fill="url(#sunGlow)" />
    <circle cx="1120" cy="110" r="55" fill="url(#sunGrad)" />

    <!-- غيوم ناعمة بألوان هادئة -->
    <!-- غيمة 1 -->
    <g fill="#ffffff" opacity="0.82" transform="translate(140, 70) scale(0.9)">
        <circle cx="60" cy="50" r="35" />
        <circle cx="100" cy="40" r="42" />
        <circle cx="145" cy="48" r="35" />
        <rect x="50" y="50" width="105" height="35" rx="16" />
    </g>

    <!-- غيمة 2 -->
    <g fill="#ffffff" opacity="0.75" transform="translate(820, 85) scale(0.75)">
        <circle cx="60" cy="50" r="32" />
        <circle cx="95" cy="42" r="38" />
        <circle cx="135" cy="48" r="30" />
        <rect x="50" y="50" width="95" height="30" rx="15" />
    </g>

    <!-- غيمة 3 صغيرة هادئة -->
    <g fill="#ffffff" opacity="0.7" transform="translate(490, 110) scale(0.6)">
        <circle cx="60" cy="50" r="28" />
        <circle cx="95" cy="42" r="32" />
        <circle cx="130" cy="48" r="26" />
        <rect x="50" y="50" width="90" height="26" rx="13" />
    </g>

    <!-- قوس قزح باستيل هادئ جداً في الخلفية البعيدة لإضفاء البهجة دون تشتيت -->
    <g opacity="0.22" transform="translate(90, 130)">
        <path d="M 0,260 A 260,260 0 0,1 520,260" fill="none" stroke="#f6a5a5" stroke-width="8" />
        <path d="M 8,260 A 252,252 0 0,1 512,260" fill="none" stroke="#fbd38d" stroke-width="8" />
        <path d="M 16,260 A 244,244 0 0,1 504,260" fill="none" stroke="#9ae6b4" stroke-width="8" />
        <path d="M 24,260 A 236,236 0 0,1 496,260" fill="none" stroke="#90cdf4" stroke-width="8" />
        <path d="M 32,260 A 228,228 0 0,1 488,260" fill="none" stroke="#d6bcfa" stroke-width="8" />
    </g>

    <!-- تلال خضراء هادئة في الأسفل تمنح ثباتاً بصرياً (Visual Grounding) -->
    <!-- التل البعيد -->
    <path d="M -50,560 Q 280,480 620,540 T 1330,510 L 1330,730 L -50,730 Z" fill="url(#hillFar)" opacity="0.85" />

    <!-- التل الأوسط -->
    <path d="M -40,600 Q 320,530 750,590 T 1320,560 L 1320,730 L -40,730 Z" fill="url(#hillMid)" opacity="0.9" />

    <!-- التل الأمامي المريح للعين -->
    <path d="M -20,635 Q 220,575 560,625 T 1300,605 L 1300,730 L -20,730 Z" fill="url(#hillNear)" />

    <!-- تفاصيل نباتية ناعمة وبسيطة جداً عند أطراف الشاشة لعدم التداخل مع عناصر التحكم -->
    <!-- زهور باستيل صغيرة في أقصى اليمين واليسار -->
    <g opacity="0.75">
        <!-- يسار -->
        <circle cx="80" cy="650" r="7" fill="#ffeaa7" />
        <circle cx="115" cy="665" r="6" fill="#fab1a0" />
        <circle cx="60" cy="675" r="8" fill="#fdcb6e" />
        <!-- يمين -->
        <circle cx="1200" cy="640" r="7" fill="#fab1a0" />
        <circle cx="1235" cy="660" r="8" fill="#ffeaa7" />
        <circle cx="1170" cy="670" r="6" fill="#a8e6cf" />
    </g>
</svg>
